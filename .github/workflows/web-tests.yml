name: Web tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capture-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check web/capture_protocol.js
          node --check web/scope.js
      - name: Run capture protocol tests
        run: node --test web/tests/capture_protocol.test.js
