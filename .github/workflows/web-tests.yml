name: Web tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capture-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check web/capture_protocol.js
          node --check web/scope.js
      - name: Run browser protocol and control tests
        run: npm test
      - name: Check FFT arithmetic and UART parser
        run: |
          python3 tests/fft_math_test.py
          g++ -std=c++11 tests/fft_protocol_test.cpp -o /tmp/fft_protocol_test
          /tmp/fft_protocol_test tests/fixtures/fft_snapshot.bin
